services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: serfy-retain-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: serfy-retain-frontend
    ports:
      - "8501:8501"
    environment:
      API_URL: http://backend:8000
      PRODUCT_NAME: Serfy Retain
    depends_on:
      - backend
    restart: unless-stopped
